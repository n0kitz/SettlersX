name: "🛡 CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: "🔍 Analyze C#"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    defaults:
      run:
        shell: bash
        working-directory: SettlersX

    steps:
      - name: "📋 Checkout"
        uses: actions/checkout@v4

      - name: "💽 Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: SettlersX/global.json

      - name: "🧠 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: "🔧 Build"
        run: dotnet build SettlersX.sln -c Debug

      - name: "🔍 Analyze"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
